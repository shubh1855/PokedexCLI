name: Go CI
on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
jobs:
  ci:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Verify dependencies
        run: go mod tidy
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Run tests
        run: go test ./...
      - name: Build project
        run: go build .
