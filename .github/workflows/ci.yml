name: Go CI
on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
jobs:
  ci:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Verify dependencies
        run: go mod tidy
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Build project
        run: go build .
